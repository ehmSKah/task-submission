[project]
name = "order-consumer"
version = "0.1.0"
description = "Consumes order placed events, stores the orders and hands them over to the fulfilment service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "confluent-kafka>=2.16",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "structlog>=25.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order_consumer"]
