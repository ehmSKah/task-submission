openapi: 3.1.0
info:
  title: Fulfilment service
  version: 1.0.0
  description: >-
    The downstream system that ships accepted orders. This contract is a stand-in designed for the
    assignment (ADR 0003): an order is handed over with one POST, keyed by an Idempotency-Key, so a
    repeated handover never creates a second fulfilment order.
security:
  - bearerAuth: []
paths:
  /fulfilment-orders:
    post:
      operationId: createFulfilmentOrder
      summary: Hand over an accepted order
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: The order id. A repeat with the same key and body gets the stored response, the original 201 with the same id.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FulfilmentOrderRequest"
            example:
              externalReference: 3f1c2a9e-8b4d-4c1e-9f2a-6d7e8f9a0b1c
              customerReference: a9e2b7c4-1d3f-4e5a-8b6c-7d8e9f0a1b2c
              orderedAt: "2026-10-17T09:12:03Z"
              lines:
                - sku: KNE-ESC-0042
                  quantity: 2
                  unitPrice: { amount: "19.99", currency: EUR }
                  lineTotal: { amount: "39.98", currency: EUR }
              total: { amount: "39.98", currency: EUR }
      responses:
        "201":
          description: The fulfilment order was created, or this is the stored response to its creation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FulfilmentOrder"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    FulfilmentOrderRequest:
      type: object
      additionalProperties: false
      required: [externalReference, customerReference, orderedAt, lines, total]
      properties:
        externalReference:
          type: string
          format: uuid
        customerReference:
          type: string
          format: uuid
        orderedAt:
          type: string
          format: date-time
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/Line"
        total:
          $ref: "#/components/schemas/Amount"
    Line:
      type: object
      additionalProperties: false
      required: [sku, quantity, unitPrice, lineTotal]
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 64
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: "#/components/schemas/Amount"
        lineTotal:
          $ref: "#/components/schemas/Amount"
    Amount:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: "^[0-9]+(\\.[0-9]+)?$"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    FulfilmentOrder:
      type: object
      additionalProperties: false
      required: [id, externalReference]
      properties:
        id:
          type: string
        externalReference:
          type: string
          format: uuid
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
