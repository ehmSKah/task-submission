[project]
name = "fulfilment-stub"
version = "0.1.0"
description = "A stand-in for the fulfilment service, with a journal for tests (ADR 0003)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.118",
    "openapi-core>=0.19.5",
    "pydantic>=2.12",
    "structlog>=25.4",
    "uvicorn>=0.37",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fulfilment_stub"]
