# Static checks, unit tests with the coverage gates, then the adapter, integration and contract
# suites against Floci (ADR 0011).
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: task1

# Reports are uploaded only once this pattern (a JWT: two base64url JSON segments) is absent
# from them, so a token can never leave the runner in an artifact (ADR 0012).
env:
  TOKEN_PATTERN: 'eyJ[A-Za-z0-9_-]+\.eyJ'

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: task1/infra/package-lock.json
      - run: make install
      # Ruff, mypy, import-linter, the OpenAPI document (openapi-spec-validator, Spectral) and
      # cdk-nag at synth.
      - run: make lint

  unit:
    needs: [static]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make test PYTEST_ARGS=--junitxml=build/junit-unit.xml
      - run: make coverage
      - id: no-tokens
        if: always()
        run: '! grep -rlE "$TOKEN_PATTERN" build/*.xml build/coverage-html'
      - if: always() && steps.no-tokens.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: unit-reports
          path: |
            task1/build/junit-unit.xml
            task1/build/coverage.xml
            task1/build/coverage-html/

  floci:
    needs: [unit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: task1/infra/package-lock.json
      # Avoids the 10+ s image pull on the first Lambda invoke.
      - run: docker pull -q public.ecr.aws/lambda/python:3.13
      - run: make up
      - run: make test-adapter PYTEST_ARGS=--junitxml=build/junit-adapter.xml
      - run: make test-integration PYTEST_ARGS=--junitxml=build/junit-integration.xml
      - run: make contract-test PYTEST_ARGS=--junitxml=build/junit-contract.xml
      - if: failure()
        run: |
          docker logs orders-api-floci-1 > build/floci.log 2>&1 || true
          for c in $(docker ps -aq --filter label=floci=true); do
            docker logs "$c" > "build/$(docker inspect -f '{{.Name}}' "$c" | tr -d /).log" 2>&1 || true
          done
      - id: no-tokens
        if: always()
        run: '! grep -lE "$TOKEN_PATTERN" build/*.xml build/*.log build/endpoints.json'
      - if: always() && steps.no-tokens.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: floci-run
          path: |
            task1/build/junit-adapter.xml
            task1/build/junit-integration.xml
            task1/build/junit-contract.xml
            task1/build/*.log
            task1/build/endpoints.json
      - if: always()
        run: make down
