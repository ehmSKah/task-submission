# The hardened production example (ADR 0010): data is kept and protected, nothing exists for
# tests. The account is the one of the caller's credentials; it is never written here.
name: aws-prod
target: aws
region: us-east-1
stageName: live
lambdaArchitecture: arm64
logLevel: INFO
logRetentionDays: 90
removalPolicy: retain
seedUsers: false
testFixtures: false
rateLimitConfigCacheSeconds: 60
accessLogs: true
wafRateLimit: 3000
