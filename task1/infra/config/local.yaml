# Local development on the Floci emulator (ADR 0010).
name: local
target: floci
account: "000000000000"
region: us-east-1
stageName: live
lambdaArchitecture: host
logLevel: DEBUG
logRetentionDays: 7
removalPolicy: destroy
seedUsers: true
testFixtures: true
rateLimitConfigCacheSeconds: 2
fixtureTokenValiditySeconds: 1
flociIssuerBaseUrl: http://floci:4566
flociUserPoolId: us-east-1_ordersapilocal
# Deployed and read back on Floci, not enforced there (ADR 0006).
wafTestRuleLimit: 100
# Swagger UI from `make docs` calls the API from the browser (ADR 0014).
corsAllowedOrigins:
  - http://localhost:8080
