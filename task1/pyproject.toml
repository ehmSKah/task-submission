[project]
name = "orders-api"
version = "0.1.0"
description = "Orders REST API with Cognito authentication, role-based authorization and rate limiting"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aws-lambda-powertools[parser,validation]>=3.20",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "openapi-core>=0.19",
    "ruff>=0.13",
    "mypy>=1.18",
    "import-linter>=2.5",
    "pyyaml>=6.0",
    "types-PyYAML",
    "boto3>=1.40",
    "boto3-stubs[dynamodb,cognito-idp,secretsmanager,cloudformation]>=1.40",
]
infra = [
    "aws-cdk-lib>=2.220",
    "constructs>=10.4",
    "cdk-nag>=2.37,<3",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "boto3>=1.40",
]

[tool.uv]
default-groups = ["dev", "infra"]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orders_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["infra"]
addopts = "-ra --strict-markers"
markers = [
    "integration: HTTP tests against the deployed stack (needs build/endpoints.json)",
    "adapter: outbound adapters against the emulator (needs build/endpoints.json)",
    "floci_only: needs Floci behaviour AWS can't reproduce; skipped on other targets",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["build", "infra/cdk.out", "infra/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["orders_api", "orders_api_infra", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["src", "infra"]
packages = ["orders_api", "orders_api_infra"]

[[tool.mypy.overrides]]
module = ["aws_cdk.*", "cdk_nag.*", "constructs.*"]
follow_imports = "silent"

[tool.importlinter]
root_packages = ["orders_api"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain and application know nothing about AWS or adapters"
type = "forbidden"
source_modules = ["orders_api.domain", "orders_api.application"]
forbidden_modules = ["orders_api.adapters", "boto3", "botocore", "aws_lambda_powertools"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The token validator stays independent of Lambda and adapters"
type = "forbidden"
source_modules = ["orders_api.auth"]
forbidden_modules = ["orders_api.adapters", "aws_lambda_powertools"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = ["orders_api.adapters", "orders_api.application", "orders_api.domain"]
