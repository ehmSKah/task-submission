openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
  description: >-
    Orders REST API with Amazon Cognito authentication, role-based authorization and rate
    limiting. Every error is an RFC 9457 Problem Details document.


    Every order operation is rate limited per client IP and per user, in fixed 60-second
    windows; malformed and forbidden requests count too. Each response the API function sends
    after counting, errors included, carries `RateLimit-Limit`, `RateLimit-Remaining` and
    `RateLimit-Reset` for the more restrictive of the two limits. Errors from the gateway
    itself (an invalid token, a body that fails its schema, an unknown path) carry none.
tags:
  - name: health
  - name: orders
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness check
      description: Shallow check that the API function runs. Needs no token and is not rate limited.
      security: []
      responses:
        "200":
          description: The API function is running.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Create an order
      description: >-
        Creates a `PENDING` order owned by the caller. The API computes `totalAmount`; clients
        never send it, nor `id`, `ownerId`, `status`, timestamps or `version`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Makes retries safe (IETF draft "The Idempotency-Key HTTP Header Field"). A key is
            scoped to the caller and remembered for 24 hours. Repeating it with the same body
            replays the original `201` without creating a second order; with a different body it
            is a `422`; while the first request is still in progress it is a `409`. Without the
            header every request creates an order.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: The created order.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/IdempotencyKeyMismatch"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    get:
      tags: [orders]
      operationId: listOrders
      summary: List orders, newest first
      description: >-
        Callers with `order:read:any` list every order; everyone else only their own. Orders are
        sorted by `createdAt`, newest first, with `id` breaking ties. Follow `nextCursor` until it
        is `null` to get every order exactly once; orders created during the walk are not part of
        it. The last page may be empty. No other query parameters are accepted. Lists are
        eventually consistent: an order created a moment ago may take a fraction of a second to
        appear.
      parameters:
        - name: limit
          in: query
          required: false
          description: The most orders one page holds.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque: the `nextCursor` of the previous page, unchanged. It only continues the list
            it came from; a cursor from a different list is a `400`.
          schema:
            type: string
      responses:
        "200":
          description: One page of orders, newest first.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The order's id (UUID v4).
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    get:
      tags: [orders]
      operationId: getOrder
      summary: Retrieve an order
      description: >-
        Callers with `order:read:any` read any order; everyone else only their own. An order the
        caller may not see is a `404`, exactly like one that doesn't exist.
      responses:
        "200":
          description: The order.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    delete:
      tags: [orders]
      operationId: deleteOrder
      summary: Delete an order
      description: >-
        Removes the order for good, in whatever status. An administrative act that needs
        `order:delete:any` (ADMIN only); customers cancel instead. Afterwards the order is a `404`.
      responses:
        "204":
          description: The order is deleted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/orders/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        description: The order's id (UUID v4).
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    patch:
      tags: [orders]
      operationId: changeOrderStatus
      summary: Change an order's status
      description: >-
        Moves the order to the next status: `PENDING → CONFIRMED → SHIPPED → DELIVERED`, or to
        `CANCELLED` from `PENDING` or `CONFIRMED`. Forward only, one step at a time; `DELIVERED`
        and `CANCELLED` are final. Cancelling needs `order:cancel:own` (your own orders) or
        `order:status:any`; every other status needs `order:status:any`, decided before the order
        is read. Someone else's order is a `404` to a caller who may only cancel their own.
        Requesting the status the order already has is a `200` that changes nothing. A change
        the order's current status doesn't allow is a `409 Conflict`, also when a concurrent
        change got there first. Every change increments `version`.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: >-
            The order's `ETag` from an earlier response, e.g. `"3"`. The change is only made while
            the order is still at that version; otherwise `412`, which is decided before a `409`
            or a same-status `200`. Several tags may be listed, and `*` accepts any version.
            Comparison is strong, so a weak tag (`W/"3"`) never matches. Without the header no
            version is checked.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOrderStatusRequest"
      responses:
        "200":
          description: The order with its new status, or unchanged if it already had it.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An access token from the identity provider (Amazon Cognito), sent as
        `Authorization: Bearer <token>`.
  headers:
    X-Request-Id:
      description: API Gateway's request id; also in every error body and in the logs.
      schema:
        type: string
    RateLimit-Limit:
      description: >-
        Requests allowed per 60-second window by the more restrictive of the two limits that
        apply (per client IP, per user), or by the one exceeded on a `429`.
      required: true
      schema:
        type: integer
        minimum: 0
    RateLimit-Remaining:
      description: Requests left in the current window under that limit.
      required: true
      schema:
        type: integer
        minimum: 0
    RateLimit-Reset:
      description: Seconds until the current window ends and the counts start again.
      required: true
      schema:
        type: integer
        minimum: 0
    Retry-After:
      description: Seconds until the window ends; retrying earlier is refused again.
      required: true
      schema:
        type: integer
        minimum: 0
    ETag:
      description: The order's `version` as a strong entity tag, e.g. `"1"`.
      required: true
      schema:
        type: string
        pattern: '^"[0-9]+"$'
  schemas:
    CreateOrderRequest:
      description: >-
        What a client sends to create an order. Everything else is set by the API. Request
        schemas are self-contained (no `$ref`), so every gateway can use them as one model.
      type: object
      additionalProperties: false
      required: [currency, items]
      properties:
        currency:
          type: string
          enum: [EUR, USD, GBP]
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [sku, quantity, unitPrice]
            properties:
              sku:
                type: string
                pattern: "^[A-Z0-9][A-Z0-9-]{1,31}$"
              quantity:
                type: integer
                minimum: 1
                maximum: 999
              unitPrice:
                type: integer
                minimum: 0
                maximum: 1000000
                description: Integer minor units of the order's currency (1999 = 19.99).
    ChangeOrderStatusRequest:
      description: >-
        The status an order should move to. Self-contained (no `$ref`), like every request schema.
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, CONFIRMED, SHIPPED, DELIVERED, CANCELLED]
    Order:
      type: object
      additionalProperties: false
      required: [id, ownerId, status, currency, items, totalAmount, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          description: Server-generated UUID v4, lowercase.
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        ownerId:
          type: string
          description: The owner's subject (`sub`) at the identity provider.
        status:
          type: string
          enum: [PENDING, CONFIRMED, SHIPPED, DELIVERED, CANCELLED]
        currency:
          type: string
          enum: [EUR, USD, GBP]
        items:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        totalAmount:
          type: integer
          description: Sum of quantity × unit price, in minor units; computed by the API.
        createdAt:
          type: string
          description: ISO-8601 UTC with fixed-width milliseconds, e.g. `2026-10-17T09:30:00.123Z`.
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
        updatedAt:
          type: string
          description: ISO-8601 UTC with fixed-width milliseconds, e.g. `2026-10-17T09:30:00.123Z`.
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
        version:
          type: integer
          description: Incremented on every change; also sent as the `ETag`.
    LineItem:
      type: object
      additionalProperties: false
      required: [sku, quantity, unitPrice]
      properties:
        sku:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: integer
          description: Integer minor units of the order's currency (1999 = 19.99).
    OrderPage:
      description: One page of a newest-first list of orders.
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Order"
        nextCursor:
          description: Pass it as `cursor` to get the next page; `null` once there are no more orders.
          # `null` without `nullable`, which draft-04 doesn't know (ADR 0008).
          anyOf:
            - type: string
              minLength: 1
            - enum: [null]
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      description: RFC 9457 Problem Details.
      type: object
      additionalProperties: false
      required: [type, title]
      properties:
        type:
          type: string
          description: >-
            The error kind. `about:blank` marks a generic error produced by the gateway itself.
          enum:
            - urn:problem:orders-api:validation-error
            - urn:problem:orders-api:unauthorized
            - urn:problem:orders-api:forbidden
            - urn:problem:orders-api:not-found
            - urn:problem:orders-api:conflict
            - urn:problem:orders-api:precondition-failed
            - urn:problem:orders-api:payload-too-large
            - urn:problem:orders-api:unsupported-media-type
            - urn:problem:orders-api:idempotency-key-mismatch
            - urn:problem:orders-api:rate-limited
            - urn:problem:orders-api:internal-error
            - urn:problem:orders-api:bad-gateway
            - urn:problem:orders-api:service-unavailable
            - urn:problem:orders-api:gateway-timeout
            - about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        scope:
          description: On a `429`, the limit that was hit, per client IP or per user.
          type: string
          enum: [ip, user]
        errors:
          description: >-
            Field-level errors, present only when the API function found them (gateway
            validation reports a single message in `detail`).
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      description: Exactly one of `pointer` or `parameter` locates the error.
      type: object
      additionalProperties: false
      required: [detail]
      oneOf:
        - required: [pointer]
        - required: [parameter]
      properties:
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) to the offending part of the request body.
        parameter:
          type: string
          description: Name of the offending path or query parameter.
        detail:
          type: string
  responses:
    Unauthorized:
      description: Missing, malformed, invalid or expired access token. The body never says which.
      headers:
        WWW-Authenticate:
          description: '`Bearer error="invalid_token"` (RFC 6750).'
          schema:
            type: string
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: >-
        A rate limit is exhausted: per client IP or per user (`scope` names which), counted in
        fixed 60-second windows. Requests over the limit don't count against it. Retry after
        `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: >-
        The caller's roles lack the permission for this operation, e.g. a valid token without any
        recognised role. Decided before any data is read.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: The identity provider's signing keys can't be reached.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: >-
        Unknown path or method, or a resource the caller can't see. Carries the `RateLimit-*`
        headers for an order the caller can't see.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: >-
        The request conflicts with the current state, e.g. a request with the same
        `Idempotency-Key` is still in progress.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: >-
        `If-Match` names none of the order's current version: the order changed since the client
        read it. Read it again before deciding.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IdempotencyKeyMismatch:
      description: The `Idempotency-Key` was already used with a different request body.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: >-
        Unexpected error. The body contains no internals. Carries the `RateLimit-*` headers if
        the request was counted first.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadGateway:
      description: The API function failed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GatewayTimeout:
      description: The API function did not answer in time.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationError:
      description: >-
        The request breaks the contract: a body that fails its schema (unknown fields included),
        isn't JSON or is empty; duplicate SKUs; a malformed path parameter; an unknown, repeated
        or malformed query parameter. Carries the `RateLimit-*` headers when the API function
        answers, not when the gateway does.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: The request body is larger than 64 KB.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/problem+json:
          schema:
