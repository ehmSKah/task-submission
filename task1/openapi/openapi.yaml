openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
  description: >-
    Orders REST API with Amazon Cognito authentication, role-based authorization and rate
    limiting. Every error is an RFC 9457 Problem Details document.
tags:
  - name: health
  - name: orders
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness check
      description: Shallow check that the API function runs. Needs no token and is not rate limited.
      security: []
      responses:
        "200":
          description: The API function is running.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Create an order
      description: >-
        Creates a `PENDING` order owned by the caller. The API computes `totalAmount`; clients
        never send it, nor `id`, `ownerId`, `status`, timestamps or `version`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Makes retries safe (IETF draft "The Idempotency-Key HTTP Header Field"). A key is
            scoped to the caller and remembered for 24 hours. Repeating it with the same body
            replays the original `201` without creating a second order; with a different body it
            is a `422`; while the first request is still in progress it is a `409`. Without the
            header every request creates an order.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: The created order.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/IdempotencyKeyMismatch"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The order's id (UUID v4).
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    get:
      tags: [orders]
      operationId: getOrder
      summary: Retrieve an order
      description: >-
        Callers with `order:read:any` read any order; everyone else only their own. An order the
        caller may not see is a `404`, exactly like one that doesn't exist.
      responses:
        "200":
          description: The order.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An access token from the identity provider (Amazon Cognito), sent as
        `Authorization: Bearer <token>`.
  headers:
    X-Request-Id:
      description: API Gateway's request id; also in every error body and in the logs.
      schema:
        type: string
    ETag:
      description: The order's `version` as a strong entity tag, e.g. `"1"`.
      required: true
      schema:
        type: string
        pattern: '^"[0-9]+"$'
  schemas:
    CreateOrderRequest:
      description: >-
        What a client sends to create an order. Everything else is set by the API. Request
        schemas are self-contained (no `$ref`), so every gateway can use them as one model.
      type: object
      additionalProperties: false
      required: [currency, items]
      properties:
        currency:
          type: string
          enum: [EUR, USD, GBP]
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [sku, quantity, unitPrice]
            properties:
              sku:
                type: string
                pattern: "^[A-Z0-9][A-Z0-9-]{1,31}$"
              quantity:
                type: integer
                minimum: 1
                maximum: 999
              unitPrice:
                type: integer
                minimum: 0
                maximum: 1000000
                description: Integer minor units of the order's currency (1999 = 19.99).
    Order:
      type: object
      additionalProperties: false
      required: [id, ownerId, status, currency, items, totalAmount, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          description: Server-generated UUID v4, lowercase.
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        ownerId:
          type: string
          description: The owner's subject (`sub`) at the identity provider.
        status:
          type: string
          enum: [PENDING, CONFIRMED, SHIPPED, DELIVERED, CANCELLED]
        currency:
          type: string
          enum: [EUR, USD, GBP]
        items:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        totalAmount:
          type: integer
          description: Sum of quantity × unit price, in minor units; computed by the API.
        createdAt:
          type: string
          description: ISO-8601 UTC with fixed-width milliseconds, e.g. `2026-10-17T09:30:00.123Z`.
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
        updatedAt:
          type: string
          description: ISO-8601 UTC with fixed-width milliseconds, e.g. `2026-10-17T09:30:00.123Z`.
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
        version:
          type: integer
          description: Incremented on every change; also sent as the `ETag`.
    LineItem:
      type: object
      additionalProperties: false
      required: [sku, quantity, unitPrice]
      properties:
        sku:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: integer
          description: Integer minor units of the order's currency (1999 = 19.99).
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      description: RFC 9457 Problem Details.
      type: object
      additionalProperties: false
      required: [type, title]
      properties:
        type:
          type: string
          description: >-
            The error kind. `about:blank` marks a generic error produced by the gateway itself.
          enum:
            - urn:problem:orders-api:validation-error
            - urn:problem:orders-api:unauthorized
            - urn:problem:orders-api:forbidden
            - urn:problem:orders-api:not-found
            - urn:problem:orders-api:conflict
            - urn:problem:orders-api:precondition-failed
            - urn:problem:orders-api:payload-too-large
            - urn:problem:orders-api:unsupported-media-type
            - urn:problem:orders-api:idempotency-key-mismatch
            - urn:problem:orders-api:rate-limited
            - urn:problem:orders-api:internal-error
            - urn:problem:orders-api:bad-gateway
            - urn:problem:orders-api:service-unavailable
            - urn:problem:orders-api:gateway-timeout
            - about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        errors:
          description: >-
            Field-level errors, present only when the API function found them (gateway
            validation reports a single message in `detail`).
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      description: Exactly one of `pointer` or `parameter` locates the error.
      type: object
      additionalProperties: false
      required: [detail]
      oneOf:
        - required: [pointer]
        - required: [parameter]
      properties:
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) to the offending part of the request body.
        parameter:
          type: string
          description: Name of the offending path or query parameter.
        detail:
          type: string
  responses:
    Unauthorized:
      description: Missing, malformed, invalid or expired access token. The body never says which.
      headers:
        WWW-Authenticate:
          description: '`Bearer error="invalid_token"` (RFC 6750).'
          schema:
            type: string
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: >-
        The caller's roles lack the permission for this operation, e.g. a valid token without any
        recognised role. Decided before any data is read.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: The identity provider's signing keys can't be reached.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Unknown path or method, or a resource the caller can't see.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: >-
        The request conflicts with the current state, e.g. a request with the same
        `Idempotency-Key` is still in progress.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IdempotencyKeyMismatch:
      description: The `Idempotency-Key` was already used with a different request body.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected error. The body contains no internals.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadGateway:
      description: The API function failed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GatewayTimeout:
      description: The API function did not answer in time.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationError:
      description: >-
        The request breaks the contract: a body that fails its schema (unknown fields included),
        isn't JSON or is empty; duplicate SKUs; a malformed path parameter.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: The request body is larger than 64 KB.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request body isn't sent as `application/json`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
